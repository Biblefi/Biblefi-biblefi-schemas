name: BibleFi Agentic Scripture Pipeline

on:
  schedule:
    # Run the master agent every hour at minute 0
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: "Reason for manual trigger (for audit log)"
        required: false
        default: "manual"
      translation:
        description: "Bible translation to search (default: KJV)"
        required: false
        default: "KJV"
      book_range_from:
        description: "First book to include in this run (default: Genesis)"
        required: false
        default: "Genesis"
      book_range_to:
        description: "Last book to include in this run (default: Revelation)"
        required: false
        default: "Revelation"

concurrency:
  # Prevent overlapping hourly runs; cancel any pending run if a new schedule fires
  group: biblefi-agentic-pipeline
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  # STAGE 1 — Master Agent (orchestrator)
  # Creates the AgentRunLog envelope and spawns subagent tasks
  # ─────────────────────────────────────────────────────────────────
  master-agent:
    name: "Master Agent — Initialise Run"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run_id: ${{ steps.init-run.outputs.run_id }}
      trigger_type: ${{ steps.init-run.outputs.trigger_type }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Initialise AgentRunLog
        id: init-run
        run: |
          RUN_ID=$(node -e "const { randomUUID } = require('crypto'); console.log(randomUUID());")
          TRIGGER_TYPE="${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "trigger_type=${TRIGGER_TYPE}" >> "$GITHUB_OUTPUT"
          echo "Master Agent initialised run: ${RUN_ID} (trigger: ${TRIGGER_TYPE})"

      - name: Validate agent_envelope schema is valid JSON
        run: |
          node -e "
            const fs = require('fs');
            const schemas = [
              'schemas/agent_envelope.schema.json',
              'schemas/agent_task.schema.json',
              'schemas/agent_run_log.schema.json',
              'schemas/scripture_seed_batch.schema.json',
              'schemas/cross_language_validation.schema.json',
              'schemas/theological_validation.schema.json',
              'schemas/scripture_record.schema.json'
            ];
            schemas.forEach(s => {
              JSON.parse(fs.readFileSync(s, 'utf8'));
              console.log('✅ Schema valid:', s);
            });
          "

  # ─────────────────────────────────────────────────────────────────
  # STAGE 2 — Scripture Search Subagent
  # Traverses KJV Genesis→Revelation for financially-themed passages
  # Operates in its own isolated sandbox (separate job/container)
  # ─────────────────────────────────────────────────────────────────
  scripture-search:
    name: "Subagent — Scripture Search (KJV)"
    runs-on: ubuntu-latest
    needs: master-agent
    permissions:
      contents: read
    outputs:
      task_id: ${{ steps.search.outputs.task_id }}
      records_found: ${{ steps.search.outputs.records_found }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scripture search against KJV financial keywords
        id: search
        env:
          RUN_ID: ${{ needs.master-agent.outputs.run_id }}
          TRANSLATION: ${{ github.event.inputs.translation || 'KJV' }}
          BOOK_FROM: ${{ github.event.inputs.book_range_from || 'Genesis' }}
          BOOK_TO: ${{ github.event.inputs.book_range_to || 'Revelation' }}
        run: |
          TASK_ID=$(node -e "const { randomUUID } = require('crypto'); console.log(randomUUID());")
          echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"

          echo "Scripture Search Subagent starting..."
          echo "  Run ID       : ${RUN_ID}"
          echo "  Task ID      : ${TASK_ID}"
          echo "  Translation  : ${TRANSLATION}"
          echo "  Book range   : ${BOOK_FROM} → ${BOOK_TO}"
          echo "  Sandbox      : \$GITHUB_JOB / runner \$RUNNER_NAME"

          # Validate that the AgentTask schema is correctly structured
          node -e "
            const schema = JSON.parse(require('fs').readFileSync('schemas/agent_task.schema.json', 'utf8'));
            const agentTypes = schema.properties.agent_type.enum;
            if (!agentTypes.includes('scripture_search')) {
              throw new Error('scripture_search agent type not found in schema');
            }
            const financialKeywords = schema.properties.input.properties.financial_keywords;
            console.log('✅ AgentTask schema validated for scripture_search');
            console.log('   Financial keyword field description:', financialKeywords.description.substring(0, 80) + '...');
          "

          # Emit a placeholder record count (real implementation pulls from Bible API/corpus)
          echo "records_found=0" >> "$GITHUB_OUTPUT"
          echo "Scripture search stage schema validation passed."

      - name: Verify scripture_record schema supports financial_keywords field
        run: |
          node -e "
            const schema = JSON.parse(require('fs').readFileSync('schemas/scripture_record.schema.json', 'utf8'));
            const props = schema.properties;
            if (!props.financial_keywords) throw new Error('financial_keywords field missing from scripture_record schema');
            if (!props.original_language_refs) throw new Error('original_language_refs field missing from scripture_record schema');
            if (!props.cross_language_validation_id) throw new Error('cross_language_validation_id field missing from scripture_record schema');
            if (!props.theological_validation_id) throw new Error('theological_validation_id field missing from scripture_record schema');
            console.log('✅ scripture_record schema has all agentic pipeline fields');
          "

  # ─────────────────────────────────────────────────────────────────
  # STAGE 3 — Language Validator Subagent
  # Cross-references passages with Hebrew, Greek, Aramaic source texts
  # Isolated from Scripture Search (separate job/sandbox)
  # ─────────────────────────────────────────────────────────────────
  language-validation:
    name: "Subagent — Cross-Language Validation (Heb/Grk/Aram)"
    runs-on: ubuntu-latest
    needs:
      - master-agent
      - scripture-search
    permissions:
      contents: read
    outputs:
      task_id: ${{ steps.validate-lang.outputs.task_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run cross-language validation
        id: validate-lang
        env:
          RUN_ID: ${{ needs.master-agent.outputs.run_id }}
          SCRIPTURE_TASK_ID: ${{ needs.scripture-search.outputs.task_id }}
        run: |
          TASK_ID=$(node -e "const { randomUUID } = require('crypto'); console.log(randomUUID());")
          echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"

          echo "Language Validator Subagent starting..."
          echo "  Run ID              : ${RUN_ID}"
          echo "  Task ID             : ${TASK_ID}"
          echo "  Upstream search task: ${SCRIPTURE_TASK_ID}"
          echo "  Languages           : Hebrew, Greek, Aramaic"
          echo "  Sandbox             : \$GITHUB_JOB / runner \$RUNNER_NAME"

          node -e "
            const schema = JSON.parse(require('fs').readFileSync('schemas/cross_language_validation.schema.json', 'utf8'));
            const languages = schema.properties.language_results.items.properties.language.enum;
            console.log('✅ CrossLanguageValidation schema validated');
            console.log('   Supported languages:', languages.join(', '));
            const hasStrongsNumber = schema.properties.language_results.items.properties.key_terms
              .items.properties.strongs_number;
            if (!hasStrongsNumber) throw new Error('strongs_number field missing from key_terms');
            console.log('   Strong\'s number field present ✅');
          "

  # ─────────────────────────────────────────────────────────────────
  # STAGE 4 — Theological Validator Subagent
  # Consults concordances & dictionaries to confirm thematic accuracy
  # Isolated from all prior stages (separate job/sandbox)
  # ─────────────────────────────────────────────────────────────────
  theological-validation:
    name: "Subagent — Theological Validation (Concordances & Dicts)"
    runs-on: ubuntu-latest
    needs:
      - master-agent
      - language-validation
    permissions:
      contents: read
    outputs:
      task_id: ${{ steps.validate-theo.outputs.task_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run theological validation
        id: validate-theo
        env:
          RUN_ID: ${{ needs.master-agent.outputs.run_id }}
          LANG_TASK_ID: ${{ needs.language-validation.outputs.task_id }}
        run: |
          TASK_ID=$(node -e "const { randomUUID } = require('crypto'); console.log(randomUUID());")
          echo "task_id=${TASK_ID}" >> "$GITHUB_OUTPUT"

          echo "Theological Validator Subagent starting..."
          echo "  Run ID              : ${RUN_ID}"
          echo "  Task ID             : ${TASK_ID}"
          echo "  Upstream lang task  : ${LANG_TASK_ID}"
          echo "  Sandbox             : \$GITHUB_JOB / runner \$RUNNER_NAME"

          node -e "
            const schema = JSON.parse(require('fs').readFileSync('schemas/theological_validation.schema.json', 'utf8'));
            const statuses = schema.properties.overall_status.enum;
            console.log('✅ TheologicalValidation schema validated');
            console.log('   Valid overall_status values:', statuses.join(', '));
            const concRef = schema.properties.concordance_references;
            const dictDef = schema.properties.dictionary_definitions;
            if (!concRef || !dictDef) throw new Error('concordance_references or dictionary_definitions missing');
            console.log('   concordance_references field present ✅');
            console.log('   dictionary_definitions field present ✅');
          "

  # ─────────────────────────────────────────────────────────────────
  # STAGE 5 — dApp Seeder Subagent
  # Formats validated scripture records and pushes to BibleFi dApp
  # Isolated sandbox; only fires after all validation stages pass
  # ─────────────────────────────────────────────────────────────────
  dapp-seeder:
    name: "Subagent — dApp Seeder (BibleFi)"
    runs-on: ubuntu-latest
    needs:
      - master-agent
      - scripture-search
      - language-validation
      - theological-validation
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate ScriptureSeedBatch schema
        env:
          RUN_ID: ${{ needs.master-agent.outputs.run_id }}
        run: |
          echo "dApp Seeder Subagent starting..."
          echo "  Run ID  : ${RUN_ID}"
          echo "  Sandbox : \$GITHUB_JOB / runner \$RUNNER_NAME"

          node -e "
            const schema = JSON.parse(require('fs').readFileSync('schemas/scripture_seed_batch.schema.json', 'utf8'));
            const statuses = schema.properties.status.enum;
            console.log('✅ ScriptureSeedBatch schema validated');
            console.log('   Valid status values:', statuses.join(', '));

            // Verify translation sub-schema is present
            const translation = schema.properties.translation;
            if (!translation) throw new Error('translation field missing from scripture_seed_batch schema');
            console.log('   translation field present ✅');

            // Verify target_dapp sub-schema is present
            const targetDapp = schema.properties.target_dapp;
            if (!targetDapp) throw new Error('target_dapp field missing from scripture_seed_batch schema');
            console.log('   target_dapp field present ✅');
          "

      - name: Validate AgentEnvelope carries all agentic payload_types
        run: |
          node -e "
            const schema = JSON.parse(require('fs').readFileSync('schemas/agent_envelope.schema.json', 'utf8'));
            const payloadTypes = schema.properties.payload_type.enum;
            const required = [
              'agent_task',
              'agent_run_log',
              'scripture_seed_batch',
              'cross_language_validation',
              'theological_validation'
            ];
            required.forEach(pt => {
              if (!payloadTypes.includes(pt)) {
                throw new Error('Missing payload_type in AgentEnvelope: ' + pt);
              }
              console.log('  ✅ payload_type present:', pt);
            });
            console.log('✅ AgentEnvelope supports all agentic pipeline payload types');
          "

      - name: Seed summary
        env:
          RUN_ID: ${{ needs.master-agent.outputs.run_id }}
          TRIGGER: ${{ needs.master-agent.outputs.trigger_type }}
        run: |
          echo "======================================================"
          echo "  BibleFi Agentic Pipeline — Cycle Complete"
          echo "======================================================"
          echo "  Run ID       : ${RUN_ID}"
          echo "  Trigger      : ${TRIGGER}"
          echo "  Stages       : scripture_search → language_validation"
          echo "               → theological_validation → dapp_seeding"
          echo "  Status       : All schema validation checks passed ✅"
          echo "======================================================"
